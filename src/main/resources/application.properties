# PostgreSQL 连接地址（数据库：legal_vector）
db.url=jdbc:postgresql://localhost:5432/legal_vector
# 数据库用户名
db.user=postgres
# 数据库密码
db.password=postgres

# MySQL 连接信息（数据库：legal_dev）
mysql.url=jdbc:mysql://localhost:3306/legal_dev?useSSL=false&serverTimezone=UTC
mysql.user=root
mysql.password=root123456

# Embedding 模式（导入与查询必须一致）：
# - legacy：占位向量（兼容旧数据）
# - hash_ngram_v1：无外部依赖的 n-gram 哈希向量（需重建 legal_embedding）
embedding.mode=legacy

# DeepSeek API Key（请自行填写或通过环境变量注入）
deepseek.api.key=

# DeepSeek OpenAI-compatible API（LangChain4j 使用）
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
# 法律场景建议 temperature=0.0，提升稳定性
deepseek.temperature=0.0
